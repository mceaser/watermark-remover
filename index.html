<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>在线去水印</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0f1a24;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            margin: 0;
        }

        .app {
            background: white;
            border-radius: 28px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .header {
            background: #1a3344;
            color: white;
            padding: 22px 20px 18px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 span {
            background: #ffb347;
            color: #1e3a4a;
            font-size: 0.9rem;
            padding: 4px 12px;
            border-radius: 40px;
        }

        .header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .upload-area {
            background: #e9f1f8;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .file-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .file-label {
            background: #2b5f7a;
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            min-width: 160px;
            box-shadow: 0 6px 12px #1a4053;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .file-label:active {
            background: #1e465b;
            transform: scale(0.98);
        }

        #fileName {
            background: white;
            border-radius: 60px;
            padding: 14px 18px;
            font-size: 0.95rem;
            color: #1b4b61;
            flex: 2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid #b7cfdf;
        }

        .dimension-info {
            background: #cbe0ed;
            border-radius: 40px;
            padding: 8px 20px;
            font-size: 0.95rem;
            color: #124256;
            display: inline-block;
        }

        .canvas-section {
            background: #1e3d4f;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
        }

        .canvas-wrap {
            background: white;
            border-radius: 24px;
            padding: 12px;
            box-shadow: inset 0 4px 12px #8fb1c5;
            max-width: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            max-height: 60vh;
            border-radius: 16px;
            background: #f5faff;
            cursor: crosshair;
            touch-action: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .tool-section {
            background: #e3eff8;
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .brush-show {
            background: white;
            border-radius: 60px;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 1.1rem;
            color: #1a4f68;
            box-shadow: 0 2px 8px #b4d1e2;
        }

        .brush-show .value {
            background: #2b6f8a;
            color: white;
            padding: 8px 28px;
            border-radius: 40px;
        }

        .mode-group {
            display: flex;
            gap: 12px;
        }

        .mode-btn {
            flex: 1;
            background: white;
            border: 2px solid #b6d3e5;
            border-radius: 60px;
            padding: 16px 0;
            text-align: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: #1b5772;
            transition: 0.1s;
        }

        .mode-btn.active {
            background: #226481;
            border-color: #226481;
            color: white;
        }

        .action-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .action-btn {
            flex: 1 1 40%;
            background: white;
            border: none;
            border-radius: 60px;
            padding: 18px 0;
            font-weight: 700;
            font-size: 1.2rem;
            color: #1a5570;
            box-shadow: 0 6px 12px #b0cfdf;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 140px;
        }

        .action-btn.primary {
            background: #226481;
            color: white;
            box-shadow: 0 8px 16px #0e4055;
        }

        .status-card {
            background: #d0e3f0;
            border-radius: 60px;
            padding: 18px 22px;
            margin: 0 16px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #0b3a4c;
        }

        .red-number {
            background: #e63946;
            color: white;
            padding: 6px 24px;
            border-radius: 40px;
            font-size: 1.3rem;
        }

        .guide-box {
            background: #cde2f0;
            border-radius: 28px 28px 0 0;
            padding: 22px 20px;
            border-top: 3px solid #9bc1d8;
        }

        .guide-box ol {
            padding-left: 28px;
            color: #103c4f;
            font-size: 1rem;
            line-height: 2;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <h1>✦ 强力去水印</h1>
            <p>📱 涂抹红色 → 点击修复 → 红色消失 → 保存原图</p>
        </div>

        <div class="upload-area">
            <div class="file-row">
                <label for="fileInput" class="file-label">📁 选择图片</label>
                <span id="fileName">未选择图片</span>
            </div>
            <div>
                <span class="dimension-info" id="dimension">0 x 0</span>
            </div>
        </div>

        <input type="file" id="fileInput" accept="image/*">

        <div class="canvas-section">
            <div class="canvas-wrap">
                <canvas id="canvas"></canvas>
            </div>
        </div>

        <div class="tool-section">
            <div class="brush-show">
                <span>🖌️ 画笔</span>
                <span class="value">30px</span>
            </div>

            <div class="mode-group">
                <div id="modeMark" class="mode-btn active">🔴 标记</div>
                <div id="modeUnmark" class="mode-btn">⬜ 擦除</div>
            </div>

            <div class="action-group">
                <button class="action-btn" id="clearBtn">🔄 清除</button>
                <button class="action-btn primary" id="repairBtn">✨ 修复</button>
                <button class="action-btn" id="saveBtn">💾 保存</button>
            </div>
        </div>

        <div class="status-card">
            <span>🔴 红色区域</span>
            <span class="red-number" id="redCount">0</span>
        </div>

        <div class="guide-box">
            <ol>
                <li><strong>选择图片</strong>（自动适应屏幕）</li>
                <li><strong>涂抹水印</strong>（红色覆盖）</li>
                <li><strong>点击修复</strong>（红色必须归零）</li>
                <li><strong>保存原图</strong>（和上传前一样清晰）</li>
            </ol>
        </div>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const fileInput = document.getElementById('fileInput');
            const fileName = document.getElementById('fileName');
            const dimension = document.getElementById('dimension');
            const redCountSpan = document.getElementById('redCount');
            const repairBtn = document.getElementById('repairBtn');
            const clearBtn = document.getElementById('clearBtn');
            const saveBtn = document.getElementById('saveBtn');
            const modeMark = document.getElementById('modeMark');
            const modeUnmark = document.getElementById('modeUnmark');

            // 核心数据 - 所有处理都在原始尺寸
            let originalImageData = null;    // 原始图片数据
            let currentImageData = null;      // 当前图片数据（修复过程中）
            let maskData = null;               // 红色标记：1=水印，0=正常
            let imageLoaded = false;
            let isDrawing = false;
            
            let originalWidth = 0;
            let originalHeight = 0;
            
            const BRUSH_SIZE = 30;
            let currentMode = 'mark';

            modeMark.addEventListener('click', () => {
                currentMode = 'mark';
                modeMark.classList.add('active');
                modeUnmark.classList.remove('active');
            });

            modeUnmark.addEventListener('click', () => {
                currentMode = 'unmark';
                modeUnmark.classList.add('active');
                modeMark.classList.remove('active');
            });

            // 选择图片
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                fileName.textContent = file.name;
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        // 保存原始尺寸
                        originalWidth = img.width;
                        originalHeight = img.height;
                        
                        // 设置画布显示大小（适配手机）
                        const maxWidth = window.innerWidth - 70;
                        const maxHeight = window.innerHeight * 0.55;
                        
                        if (originalWidth > maxWidth || originalHeight > maxHeight) {
                            const ratio = Math.min(maxWidth / originalWidth, maxHeight / originalHeight);
                            canvas.width = Math.floor(originalWidth * ratio);
                            canvas.height = Math.floor(originalHeight * ratio);
                        } else {
                            canvas.width = originalWidth;
                            canvas.height = originalHeight;
                        }
                        
                        // 创建离屏画布保存原始图片
                        const offCanvas = document.createElement('canvas');
                        offCanvas.width = originalWidth;
                        offCanvas.height = originalHeight;
                        const offCtx = offCanvas.getContext('2d');
                        offCtx.drawImage(img, 0, 0, originalWidth, originalHeight);
                        
                        // 保存原始数据
                        originalImageData = offCtx.getImageData(0, 0, originalWidth, originalHeight);
                        currentImageData = new ImageData(
                            new Uint8ClampedArray(originalImageData.data),
                            originalWidth,
                            originalHeight
                        );
                        
                        // 初始化mask
                        maskData = new Uint8Array(originalWidth * originalHeight).fill(0);
                        
                        // 显示图片
                        ctx.drawImage(offCanvas, 0, 0, originalWidth, originalHeight, 
                                     0, 0, canvas.width, canvas.height);
                        
                        imageLoaded = true;
                        dimension.textContent = `${originalWidth} x ${originalHeight}`;
                        updateRedCount();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            // 获取原始图片坐标
            function getOriginalCoords(e) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = originalWidth / canvas.width;
                const scaleY = originalHeight / canvas.height;
                
                let clientX, clientY;
                
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                    e.preventDefault();
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                
                const canvasX = (clientX - rect.left) * (canvas.width / rect.width);
                const canvasY = (clientY - rect.top) * (canvas.height / rect.height);
                
                const originalX = Math.floor(canvasX * scaleX);
                const originalY = Math.floor(canvasY * scaleY);
                
                return {
                    x: Math.max(0, Math.min(originalX, originalWidth - 1)),
                    y: Math.max(0, Math.min(originalY, originalHeight - 1))
                };
            }

            // 涂抹
            function paint(x, y) {
                if (!imageLoaded) return;
                
                const radius = BRUSH_SIZE / 2;
                
                for (let dy = -radius; dy <= radius; dy++) {
                    for (let dx = -radius; dx <= radius; dx++) {
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist > radius) continue;
                        
                        const px = x + dx;
                        const py = y + dy;
                        
                        if (px >= 0 && px < originalWidth && py >= 0 && py < originalHeight) {
                            const idx = py * originalWidth + px;
                            maskData[idx] = (currentMode === 'mark') ? 1 : 0;
                        }
                    }
                }
                
                redrawDisplay();
            }

            // 重绘显示
            function redrawDisplay() {
                if (!imageLoaded) return;
                
                // 创建临时画布
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = originalWidth;
                tempCanvas.height = originalHeight;
                const tempCtx = tempCanvas.getContext('2d');
                tempCtx.putImageData(currentImageData, 0, 0);
                
                // 绘制原图
                ctx.drawImage(tempCanvas, 0, 0, originalWidth, originalHeight, 
                             0, 0, canvas.width, canvas.height);
                
                // 叠加红色标记
                const displayData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = displayData.data;
                
                for (let y = 0; y < canvas.height; y++) {
                    for (let x = 0; x < canvas.width; x++) {
                        const originalX = Math.floor(x * (originalWidth / canvas.width));
                        const originalY = Math.floor(y * (originalHeight / canvas.height));
                        
                        const idx = originalY * originalWidth + originalX;
                        if (maskData[idx] === 1) {
                            const pIdx = (y * canvas.width + x) * 4;
                            data[pIdx] = 255;      // 纯红
                            data[pIdx + 1] = data[pIdx + 1] * 0.2;
                            data[pIdx + 2] = data[pIdx + 2] * 0.2;
                        }
                    }
                }
                
                ctx.putImageData(displayData, 0, 0);
                updateRedCount();
            }

            function updateRedCount() {
                if (!maskData) return;
                let count = 0;
                for (let i = 0; i < maskData.length; i++) {
                    if (maskData[i] === 1) count++;
                }
                redCountSpan.textContent = count;
            }

            // 事件
            canvas.addEventListener('mousedown', (e) => {
                e.preventDefault();
                if (!imageLoaded) { alert('请先选择图片'); return; }
                isDrawing = true;
                const coord = getOriginalCoords(e);
                paint(coord.x, coord.y);
            });

            canvas.addEventListener('mousemove', (e) => {
                e.preventDefault();
                if (!isDrawing) return;
                const coord = getOriginalCoords(e);
                paint(coord.x, coord.y);
            });

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!imageLoaded) { alert('请先选择图片'); return; }
                isDrawing = true;
                const coord = getOriginalCoords(e);
                paint(coord.x, coord.y);
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!isDrawing) return;
                const coord = getOriginalCoords(e);
                paint(coord.x, coord.y);
            }, { passive: false });

            window.addEventListener('mouseup', () => isDrawing = false);
            window.addEventListener('touchend', () => isDrawing = false);
            canvas.addEventListener('mouseleave', () => isDrawing = false);

            // 清除红色
            clearBtn.addEventListener('click', () => {
                if (!imageLoaded) return;
                maskData = new Uint8Array(originalWidth * originalHeight).fill(0);
                currentImageData = new ImageData(
                    new Uint8ClampedArray(originalImageData.data),
                    originalWidth,
                    originalHeight
                );
                redrawDisplay();
            });

            // ========== 核心修复算法 ==========
            repairBtn.addEventListener('click', () => {
                if (!imageLoaded) {
                    alert('请先选择图片');
                    return;
                }
                
                // 检查是否有红色区域
                let hasRed = false;
                for (let i = 0; i < maskData.length; i++) {
                    if (maskData[i] === 1) { hasRed = true; break; }
                }
                
                if (!hasRed) {
                    alert('请先涂抹水印区域');
                    return;
                }
                
                const w = originalWidth;
                const h = originalHeight;
                const totalPixels = w * h;
                
                // 创建结果数据（从当前图片开始）
                const resultData = new Uint8ClampedArray(currentImageData.data);
                
                // 多次迭代修复（次数越多越彻底）
                for (let iter = 0; iter < 8; iter++) {
                    // 复制当前结果作为源数据
                    const sourceData = new Uint8ClampedArray(resultData);
                    
                    // 对每个红色像素进行处理
                    for (let y = 0; y < h; y++) {
                        for (let x = 0; x < w; x++) {
                            const idx = y * w + x;
                            
                            if (maskData[idx] === 1) {
                                let sumR = 0, sumG = 0, sumB = 0, totalWeight = 0;
                                
                                // 搜索范围：从大到小，保证能取到有效像素
                                const maxRadius = 30;
                                
                                for (let dy = -maxRadius; dy <= maxRadius; dy++) {
                                    for (let dx = -maxRadius; dx <= maxRadius; dx++) {
                                        const nx = x + dx;
                                        const ny = y + dy;
                                        
                                        // 边界检查
                                        if (nx < 0 || nx >= w || ny < 0 || ny >= h) continue;
                                        
                                        const nIdx = ny * w + nx;
                                        
                                        // 只使用非红色区域的有效像素
                                        if (maskData[nIdx] === 0) {
                                            // 计算距离权重（越近权重越大）
                                            const dist = Math.sqrt(dx*dx + dy*dy);
                                            if (dist > maxRadius) continue;
                                            
                                            // 高斯权重
                                            const weight = Math.exp(-dist * dist / (maxRadius * maxRadius / 4));
                                            
                                            const pIdx = nIdx * 4;
                                            sumR += sourceData[pIdx] * weight;
                                            sumG += sourceData[pIdx + 1] * weight;
                                            sumB += sourceData[pIdx + 2] * weight;
                                            totalWeight += weight;
                                        }
                                    }
                                }
                                
                                // 如果找到了有效像素，就填充
                                if (totalWeight > 0) {
                                    const pIdx = idx * 4;
                                    resultData[pIdx] = sumR / totalWeight;
                                    resultData[pIdx + 1] = sumG / totalWeight;
                                    resultData[pIdx + 2] = sumB / totalWeight;
                                }
                            }
                        }
                    }
                }
                
                // 更新当前图片数据
                currentImageData = new ImageData(resultData, w, h);
                
                // 清除红色标记（水印已修复）
                maskData = new Uint8Array(w * h).fill(0);
                
                // 重绘显示
                redrawDisplay();
                
                // 提示成功
                alert('✅ 水印已去除！红色已归零，可以保存图片');
            });
            
            // 保存图片 - 生成带时间戳的文件名
            saveBtn.addEventListener('click', () => {
                if (!imageLoaded) {
                    alert('没有图片可以保存');
                    return;
                }
                
                // 检查红色
                let redLeft = 0;
                for (let i = 0; i < maskData.length; i++) {
                    if (maskData[i] === 1) redLeft++;
                }
                
                if (redLeft > 0) {
                    if (!confirm(`还有 ${redLeft} 个红色像素，确定保存吗？`)) {
                        return;
                    }
                }
                
                // 生成时间戳 (格式: YYYYMMDD_HHMMSS)
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                
                const timestamp = `${year}${month}${day}_${hours}${minutes}${seconds}`;
                
                // 创建保存画布（原始尺寸）
                const saveCanvas = document.createElement('canvas');
                saveCanvas.width = originalWidth;
                saveCanvas.height = originalHeight;
                const saveCtx = saveCanvas.getContext('2d');
                saveCtx.putImageData(currentImageData, 0, 0);
                
                // 保存 - 带时间戳的文件名
                const link = document.createElement('a');
                link.download = `去水印_${timestamp}.png`;
                link.href = saveCanvas.toDataURL('image/png');
                link.click();
            });

            dimension.textContent = '0 x 0';
        })();
    </script>
</body>
</html>
